  <rect x="1320" y="70" width="130" height="28" rx="14" fill="#E8F5E9"/>
  <circle cx="1340" cy="84" r="5" fill="#6AA76D"/>
  <text x="1353" y="90" fill="#275D42" font-family="Arial, sans-serif" font-size="12" font-weight="700">Demo mode</text>

  <text x="370" y="180" fill="#22271F" font-family="Georgia, serif" font-size="62" font-weight="400">Make room</text>
  <text x="370" y="250" fill="#275D42" font-family="Georgia, serif" font-size="62" font-weight="400">for understanding.</text>
  <text x="370" y="300" fill="#73796E" font-family="Arial, sans-serif" font-size="18">Curiosity is a good place to start. Ask a question and build from there.</text>

  <rect x="370" y="340" width="720" height="180" rx="10" fill="#FFFDF8" stroke="#DDE2D8"/>
  <text x="390" y="376" fill="#7B8177" font-family="Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="2">WHAT'S ON YOUR MIND?</text>
  <text x="390" y="430" fill="#A4A99F" font-family="Arial, sans-serif" font-size="18">Which is the largest ocean?</text>
  <line x1="390" y1="456" x2="1060" y2="456" stroke="#EDF0EA"/>
  <rect x="390" y="470" width="120" height="26" rx="6" fill="#F2F5EE"/>
  <text x="407" y="488" fill="#5D645B" font-family="Arial, sans-serif" font-size="12">Beginner</text>
  <rect x="918" y="466" width="150" height="38" rx="8" fill="#275D42"/>
  <text x="956" y="490" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="700">Get an answer</text>

  <text x="372" y="583" fill="#7B8177" font-family="Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="2">TRY THIS</text>
  <rect x="470" y="564" width="220" height="34" rx="6" fill="#F7F8F2" stroke="#E2E7DD"/>
  <text x="490" y="586" fill="#5D645B" font-family="Arial, sans-serif" font-size="12">Which is the largest ocean?</text>
  <rect x="705" y="564" width="190" height="34" rx="6" fill="#F7F8F2" stroke="#E2E7DD"/>
  <text x="725" y="586" fill="#5D645B" font-family="Arial, sans-serif" font-size="12">Explain photosynthesis</text>

  <rect x="1160" y="340" width="320" height="460" rx="14" fill="#F2F5EE" stroke="#DDE2D8"/>
  <text x="1190" y="382" fill="#7A8177" font-family="Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="2">YOUR STUDY DESK</text>
  <line x1="1190" y1="400" x2="1435" y2="400" stroke="#D7DDCF"/>
  <text x="1190" y="435" fill="#5B6057" font-family="Georgia, serif" font-size="20">A few ways to keep moving.</text>
  <rect x="1190" y="465" width="260" height="100" rx="8" fill="#F8F9F5" stroke="#E3E7DE"/>
  <text x="1212" y="500" fill="#8C9488" font-family="Georgia, serif" font-size="18">A</text>
  <text x="1245" y="495" fill="#2F3933" font-family="Arial, sans-serif" font-size="14" font-weight="700">Check what you know</text>
  <text x="1245" y="518" fill="#7B8177" font-family="Arial, sans-serif" font-size="12">Turn a topic into a quick quiz.</text>

  <rect x="1190" y="579" width="260" height="100" rx="8" fill="#F8F9F5" stroke="#E3E7DE"/>
  <text x="1212" y="613" fill="#8C9488" font-family="Georgia, serif" font-size="18">B</text>
  <text x="1245" y="608" fill="#2F3933" font-family="Arial, sans-serif" font-size="14" font-weight="700">Plan your next steps</text>
  <text x="1245" y="630" fill="#7B8177" font-family="Arial, sans-serif" font-size="12">Build a path from curious to confident.</text>

  <rect x="1190" y="693" width="260" height="90" rx="8" fill="#F8F9F5" stroke="#E3E7DE"/>
  <text x="1212" y="726" fill="#8C9488" font-family="Georgia, serif" font-size="18">C</text>
  <text x="1245" y="721" fill="#2F3933" font-family="Arial, sans-serif" font-size="14" font-weight="700">Find the key ideas</text>
  <text x="1245" y="743" fill="#7B8177" font-family="Arial, sans-serif" font-size="12">Make a long passage easier to scan.</text>

  <text x="370" y="730" fill="#42483E" font-family="Arial, sans-serif" font-size="18">The Pacific Ocean is the largest ocean on Earth.</text>
  <text x="370" y="770" fill="#42483E" font-family="Arial, sans-serif" font-size="18">It covers more area than all of Earth’s land combined.</text>
